[project]
name = "neopedal"
dynamic = ["version", "dependencies"]
description = "Free and Open Source telemetry overlay application for racing simulation"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"

# One source per list: runtime ranges in requirements.txt (tool.setuptools.dynamic), development tools in
# requirements-dev.txt, pinned runtime of release builds in requirements-lock.txt (Checks use it as constraints)
[project.optional-dependencies]
build = [
    "pyinstaller>=6.10",
]
vr = [
    "openvr>=2.0",
]

[project.urls]
Homepage = "https://github.com/Keenny38/ModernTinyPedals"
Changelog = "https://github.com/Keenny38/ModernTinyPedals/blob/master/CHANGELOG.md"
Issues = "https://github.com/Keenny38/ModernTinyPedals/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neopedal*", "pyLMUSharedMemory*", "pyRfactor2SharedMemory*"]

# Run from source folder (python run.py) or release build: fonts, images & docs are read from the
# app folder (not packaged), so an installed wheel alone is not a supported way to run the app.
[tool.setuptools.package-data]
"neopedal.i18n" = ["data/*.json"]
"neopedal.ui" = ["qml/*.qml"]

[tool.setuptools.dynamic]
version = { attr = "neopedal.version.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["pyLMUSharedMemory", "pyRfactor2SharedMemory"]

[tool.ruff.lint]
# pyflakes, bugbear, simplify, pylint errors, pyupgrade
select = ["E9", "F", "B", "SIM", "PIE", "RUF", "PLE", "UP", "I"]
ignore = [
    "SIM102",   # nested if kept when clearer (confirmation, grouped checks)
    "SIM103",   # explicit return True/False kept when clearer
    "SIM108",   # if-else block preferred over ternary for long expressions
    "SIM113",   # manual counter kept in hot loops
    "SIM114",   # separate branches kept when they document different cases
    "RUF023",   # __slots__ grouped by meaning, not sorted
    "B905",     # zip() strict not needed, lengths are known
    "RUF012",   # class-level constant mappings
    "F403",     # widget & module registry uses star import
    "PLE0605",  # widget & module registry __all__ built dynamically
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["pyLMUSharedMemory/", "pyRfactor2SharedMemory/", "tests/"]
follow_imports = "silent"
# Every error code is checked. Black box mixins declare the attributes they read from the widget class.

[[tool.mypy.overrides]]
# Widget settings are typed per widget (template.widget_config_types): option keys built at runtime
# (f"show_{key}") can't be checked in these modules yet, read as Any; literal keys are still checked.
# Every other module is checked: a module made to pass is taken off this list (new modules never on it)
module = [
    "neopedal.widget._black_box.base", "neopedal.widget._black_box.center", "neopedal.widget._black_box.status",
    "neopedal.widget._black_box.suspension", "neopedal.widget._modern.acceleration",
    "neopedal.widget._modern.black_box", "neopedal.widget._modern.brake_performance",
    "neopedal.widget._modern.brake_wear", "neopedal.widget._modern.consumption", "neopedal.widget._modern.cruise",
    "neopedal.widget._modern.damage", "neopedal.widget._modern.damage_stats",
    "neopedal.widget._modern.deltabest_extended", "neopedal.widget._modern.differential",
    "neopedal.widget._modern.driver_rank", "neopedal.widget._modern.electric_motor",
    "neopedal.widget._modern.engine", "neopedal.widget._modern.engine_temperature", "neopedal.widget._modern.force",
    "neopedal.widget._modern.gear", "neopedal.widget._modern.heading", "neopedal.widget._modern.instrument",
    "neopedal.widget._modern.onboard_setting", "neopedal.widget._modern.pit_stop_estimate",
    "neopedal.widget._modern.relative_finish_order", "neopedal.widget._modern.ride_height",
    "neopedal.widget._modern.speed_delta", "neopedal.widget._modern.speedometer",
    "neopedal.widget._modern.steering_angle", "neopedal.widget._modern.suspension_travel",
    "neopedal.widget._modern.timing", "neopedal.widget._modern.track_notes", "neopedal.widget._modern.trailing",
    "neopedal.widget._modern.weather", "neopedal.widget._modern.weight_distribution", "neopedal.widget._pedal_alert",
    "neopedal.widget.acceleration", "neopedal.widget.brake_wear", "neopedal.widget.driver_rank",
    "neopedal.widget.friction_circle", "neopedal.widget.pedal", "neopedal.widget.pit_lane_helper",
    "neopedal.widget.race_plan", "neopedal.widget.radar", "neopedal.widget.relative_finish_order",
    "neopedal.widget.speed_delta", "neopedal.widget.track_map", "neopedal.widget.trailing",
    "neopedal.widget.tyre_wear",
]
disable_error_code = ["literal-required"]

[[tool.mypy.overrides]]
# Game data readers, data processing & user files: every function annotated
module = ["neopedal.adapter.*", "neopedal.process.*", "neopedal.userfile.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Manual tests need a running sim (pytest -m manual), benchmark runs separately (pytest -m benchmark)
addopts = "-m 'not manual and not benchmark'"
markers = [
    "manual: requires running sim, skipped by default (pytest -m manual)",
    "benchmark: widget render timing, fails on large performance regression",
]

[tool.coverage.run]
source = ["neopedal"]
omit = ["neopedal/i18n/fr.py"]

[tool.coverage.report]
skip_empty = true
# Minimum total coverage (CI fails below), kept a few points under current level (91%, same on Linux & Windows CI)
fail_under = 88
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
