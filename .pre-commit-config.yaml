# Run checks before each commit: pip install pre-commit && pre-commit install
# Hook repositories pinned to commit SHAs (tag as comment): update with "pre-commit autoupdate --freeze"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-json
        exclude: ^(settings|deltabest|trackmap)/
      - id: check-yaml
      - id: end-of-file-fixer
        files: \.py$
      - id: trailing-whitespace
        files: \.py$
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy neopedal
        language: system
        pass_filenames: false
        files: ^neopedal/.*\.py$
