name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
    - name: Checkout master
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Qt system libraries (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libpulse0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-cov ruff mypy
        pip install pyxdg
      shell: bash

    - name: Lint
      run: ruff check .

    - name: Type check
      run: mypy tinypedal

    - name: Tests (with coverage)
      run: pytest -v --cov=tinypedal --cov-report=term --cov-report=xml:coverage.xml

    - name: Widget benchmark
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      # Shared runners are 3-4x slower than a desktop and jittery: catch big regressions only
      env:
        TINYPEDAL_FRAME_BUDGET_MS: "50"
      run: pytest -m benchmark -q

    - name: Coverage summary
      if: always() && hashFiles('.coverage') != ''
      run: |
        echo "## Test coverage (${{ matrix.os }}, Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
        python -m coverage report --format=markdown --skip-covered >> $GITHUB_STEP_SUMMARY
      shell: bash

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
        path: coverage.xml
        if-no-files-found: ignore

    - name: Upload widget renders (visual review)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: widget-renders-${{ matrix.os }}-py${{ matrix.python-version }}
        path: tests/_render/
        if-no-files-found: ignore

  visual-regression:
    # Compare widget renders with the base commit, rendered on the same runner (fonts & platform match)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libpulse0
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pyxdg

    - name: Find base commit
      id: base
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
        else
          echo "sha=$(git rev-parse HEAD~1 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
        fi

    - name: Render widgets (changed)
      if: steps.base.outputs.sha != ''
      run: |
        pytest tests/test_widget_render.py -q -p no:cacheprovider
        mkdir -p visual && mv tests/_render visual/renders_new

    - name: Render widgets (base)
      if: steps.base.outputs.sha != ''
      run: |
        git worktree add "$RUNNER_TEMP/base" "${{ steps.base.outputs.sha }}"
        cd "$RUNNER_TEMP/base" && pytest tests/test_widget_render.py -q -p no:cacheprovider || true

    - name: Compare renders
      if: steps.base.outputs.sha != ''
      run: python tools/visual_diff.py "$RUNNER_TEMP/base/tests/_render" visual/renders_new visual/diff

    - name: Upload visual diff
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: widget-visual-diff
        path: visual/
        if-no-files-found: ignore
