name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
    - name: Checkout master and submodules
      uses: actions/checkout@v6
      with:
        submodules: "true"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Qt system libraries (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-cov ruff mypy
        pip install pyxdg
      shell: bash

    - name: Lint
      run: ruff check .

    - name: Type check
      run: mypy tinypedal

    - name: Tests (with coverage)
      run: pytest -v --cov=tinypedal --cov-report=term --cov-report=xml:coverage.xml

    - name: Widget benchmark
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      run: pytest -m benchmark -q

    - name: Coverage summary
      if: always() && hashFiles('.coverage') != ''
      run: |
        echo "## Test coverage (${{ matrix.os }}, Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
        python -m coverage report --format=markdown --skip-covered >> $GITHUB_STEP_SUMMARY
      shell: bash

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
        path: coverage.xml
        if-no-files-found: ignore

    - name: Upload widget renders (visual review)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: widget-renders-${{ matrix.os }}-py${{ matrix.python-version }}
        path: tests/_render/
        if-no-files-found: ignore
