name: Checks

on:
  push:
    branches: [master]  # other branches: checked through their pull request (no duplicate runs)
  pull_request:
  workflow_dispatch:

# A newer push of the same branch or pull request cancels the outdated run
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
    - name: Checkout master
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Qt system libraries (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libpulse0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-cov pytest-timeout ruff mypy
      shell: bash

    - name: Lint
      run: ruff check .

    - name: Type check
      run: mypy tinypedal

    - name: Tests (with coverage)
      # A hung test (QML page load, worker process) fails after 5 minutes instead of blocking the runner
      run: pytest -v --timeout=300 --cov=tinypedal --cov-report=term --cov-report=xml:coverage.xml

    - name: Widget benchmark
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      # Shared runners are 3-4x slower than a desktop and jittery: catch big regressions only
      env:
        TINYPEDAL_FRAME_BUDGET_MS: "50"
      run: pytest -m benchmark -q

    - name: Coverage summary
      if: always() && hashFiles('.coverage') != ''
      env:
        MATRIX_OS: ${{ matrix.os }}
        PYTHON_VERSION: ${{ matrix.python-version }}
      run: |
        echo "## Test coverage ($MATRIX_OS, Python $PYTHON_VERSION)" >> $GITHUB_STEP_SUMMARY
        python -m coverage report --format=markdown --skip-covered >> $GITHUB_STEP_SUMMARY
      shell: bash

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
        path: coverage.xml
        if-no-files-found: ignore

    - name: Upload widget renders (visual review)
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: widget-renders-${{ matrix.os }}-py${{ matrix.python-version }}
        path: tests/_render/
        if-no-files-found: ignore

  openxr-layer:
    # Native OpenXR layer of the VR overlay (native/openxr_layer), compiled warning free (warnings are errors).
    # Windows: MSVC x64 Release DLL, unit tests & integration test (fake OpenXR runtime driving the DLL with
    # D3D11 / D3D12 WARP devices, Vulkan skipped without driver). Linux: shared memory reader unit tests (GCC).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            configure: -A x64 -DTPVR_BUILD_TESTS=ON
          - os: ubuntu-latest
            configure: -DTPVR_BUILD_LAYER=OFF -DTPVR_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Build
      env:
        CONFIGURE: ${{ matrix.configure }}
      run: |
        cmake -S native/openxr_layer -B native/openxr_layer/build $CONFIGURE
        cmake --build native/openxr_layer/build --config Release
      shell: bash

    - name: Test
      run: ctest --test-dir native/openxr_layer/build -C Release --output-on-failure

    - name: Upload layer
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: openxr-layer
        path: native/openxr_layer/build/bin/
        if-no-files-found: error

  visual-regression:
    # Compare widget renders with the base commit, rendered on the same runner (fonts & platform match)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libpulse0
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-timeout

    # Base: pull request base, or commit before the push (all pushed commits compared, not only the last one)
    - name: Find base commit
      id: base
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          base="$PR_BASE_SHA"
        else
          base="$PUSH_BEFORE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || true)
          fi
        fi
        echo "sha=$base" >> "$GITHUB_OUTPUT"
        # Intended visual change: before / after image added in docs/changes (tools/make_change_visual.py),
        # or "[visual]" in a commit message. Changes are then reported without failing.
        intended=false
        if [ -n "$base" ]; then
          added_visuals=$(git diff --name-only --diff-filter=A "$base" HEAD -- 'docs/changes/*.png')
          if [ -n "$added_visuals" ] || git log --format=%B "$base..HEAD" | grep -qi '\[visual\]'; then
            intended=true
          fi
        fi
        echo "intended=$intended" >> "$GITHUB_OUTPUT"

    - name: Render widgets (changed)
      if: steps.base.outputs.sha != ''
      run: |
        pytest tests/test_widget_render.py -q -p no:cacheprovider --timeout=300
        mkdir -p visual && mv tests/_render visual/renders_new

    - name: Render widgets (base)
      if: steps.base.outputs.sha != ''
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      run: |
        git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
        cd "$RUNNER_TEMP/base" && pytest tests/test_widget_render.py -q -p no:cacheprovider --timeout=300 || true

    - name: Compare renders
      if: steps.base.outputs.sha != ''
      env:
        INTENDED: ${{ steps.base.outputs.intended }}
      run: |
        allow=""
        if [ "$INTENDED" = "true" ]; then allow="--allow-changes"; fi
        python tools/visual_diff.py $allow "$RUNNER_TEMP/base/tests/_render" visual/renders_new visual/diff

    - name: Upload visual diff
      if: always() && steps.base.outputs.sha != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: widget-visual-diff
        path: visual/
        if-no-files-found: ignore
