name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Build name"
        default: ""
        required: false
        type: string
      test_build:
        description: "Test build"
        default: false
        required: false
        type: boolean

run-name: ${{ inputs.build_name }}

defaults:
  run:
    shell: bash

jobs:
  # Create linux release file
  linux:
    runs-on: ubuntu-latest
    outputs:
      app_ver: ${{ steps.get_ver.outputs.app_ver }}
      sha256: ${{ steps.get_hash.outputs.hash_output }}

    steps:
    - name: Checkout master
      uses: actions/checkout@v6

    - name: Fetch version number
      id: get_ver
      run: |
        tp_ver=$(grep -w '__version__' './tinypedal/version.py' | grep -o -E '[0-9]+\.[0-9]+\.[0-9]+')
        echo "app_ver=${tp_ver}" >> $GITHUB_OUTPUT
        echo "TinyPedal Version:" $tp_ver

    - name: ZIP Linux file
      run: |
        file_name=ModernTinyPedals-${{ steps.get_ver.outputs.app_ver }}-linux.zip
        zip -r $file_name . -x *.git/* -x *.github/*

    - name: Check hash sum
      id: get_hash
      run: |
        sha256hash=$(sha256sum ModernTinyPedals-${{ steps.get_ver.outputs.app_ver }}-linux.zip)
        echo "hash_output=${sha256hash}" >> $GITHUB_OUTPUT
        echo $sha256hash

    - name: Upload release files
      uses: softprops/action-gh-release@v2
      if: ${{ !inputs.test_build }}
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ steps.get_ver.outputs.app_ver }}
        files: |
          ModernTinyPedals-${{ steps.get_ver.outputs.app_ver }}-linux.zip

  # Create windows release file
  windows:
    runs-on: windows-latest
    needs: linux
    outputs:
      sha256: ${{ steps.get_hash.outputs.hash_output }}

    steps:
    - name: Checkout master
      uses: actions/checkout@v6

    - name: Set up Python 3.12 environment for Windows build
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        architecture: "x64"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller openvr

    - name: Build Windows executable
      run: |
        python build_pyinstaller.py -c

    - name: ZIP Windows file
      shell: pwsh
      run: |
        $file_name="ModernTinyPedals-${{ needs.linux.outputs.app_ver }}-windows.zip"
        Compress-Archive -Path ./dist/TinyPedal -DestinationPath ./$file_name

    - name: Build Windows installer
      shell: pwsh
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
        & $iscc /DAppVersion=${{ needs.linux.outputs.app_ver }} installer\tinypedal.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Move-Item ./dist/ModernTinyPedals-${{ needs.linux.outputs.app_ver }}-windows-setup.exe .

    - name: Check hash sum
      id: get_hash
      run: |
        setup_name=ModernTinyPedals-${{ needs.linux.outputs.app_ver }}-windows-setup.exe
        sha256sum $setup_name | sed 's/\*//g' > $setup_name.sha256
        sha256hash=$(sha256sum ModernTinyPedals-${{ needs.linux.outputs.app_ver }}-windows.zip | sed 's/\*//g')
        echo "hash_output=${sha256hash}" >> $GITHUB_OUTPUT
        echo $sha256hash
        cat $setup_name.sha256

    - name: Upload release files
      uses: softprops/action-gh-release@v2
      if: ${{ !inputs.test_build }}
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.linux.outputs.app_ver }}
        files: |
          ModernTinyPedals-${{ needs.linux.outputs.app_ver }}-windows.zip
          ModernTinyPedals-${{ needs.linux.outputs.app_ver }}-windows-setup.exe
          ModernTinyPedals-${{ needs.linux.outputs.app_ver }}-windows-setup.exe.sha256

  # Generate release notes
  release-notes:
    runs-on: ubuntu-latest
    needs: [linux, windows]

    steps:
    - name: Checkout master with full history and tags
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Release notes from commits since previous release
      run: |
        python tools/gen_changelog.py --release v${{ needs.linux.outputs.app_ver }} > release.txt
        echo "" >> release.txt
        echo "### SHA256" >> release.txt
        echo "" >> release.txt
        echo "- \`${{ needs.linux.outputs.sha256 }}\`" >> release.txt
        echo "- \`${{ needs.windows.outputs.sha256 }}\`" >> release.txt
        cat release.txt

    - name: Update release notes
      uses: softprops/action-gh-release@v2
      if: ${{ !inputs.test_build }}
      with:
        body_path: release.txt
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.linux.outputs.app_ver }}
