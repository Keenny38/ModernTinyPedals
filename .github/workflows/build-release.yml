name: Build and Release

# A release is published automatically after every push to master once Checks passed.
# Version is computed from commits since the last release (tools/next_version.py):
# first release 0.10.0, then minor + 1 when a commit title starts with "Add", else patch + 1.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto: from commit titles)"
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      test_build:
        description: "Test build (no release)"
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # Decide version, skip when Checks failed or nothing to release
  version:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      app_ver: ${{ steps.next.outputs.app_ver }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
    - name: Checkout tested commit with full history and tags
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Next version
      id: next
      run: |
        ver=$(python tools/next_version.py --bump "${{ inputs.bump || 'auto' }}")
        echo "app_ver=${ver}" >> $GITHUB_OUTPUT
        echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "Next version: ${ver:-none (no change since last release)}"

  # Source code archive
  linux:
    needs: version
    if: needs.version.outputs.app_ver != ''
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.get_hash.outputs.hash_output }}
    steps:
    - name: Checkout tested commit
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.version.outputs.sha }}

    - name: Set version
      run: python3 tools/next_version.py --write ${{ needs.version.outputs.app_ver }}

    - name: ZIP source code
      run: |
        file_name=ModernTinyPedals-${{ needs.version.outputs.app_ver }}-source.zip
        zip -qr $file_name . -x "*.git/*" -x "*.github/*"

    - name: Check hash sum
      id: get_hash
      run: |
        sha256hash=$(sha256sum ModernTinyPedals-${{ needs.version.outputs.app_ver }}-source.zip)
        echo "hash_output=${sha256hash}" >> $GITHUB_OUTPUT
        echo $sha256hash

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: source
        path: ModernTinyPedals-${{ needs.version.outputs.app_ver }}-source.zip

  # Windows executable & installer
  windows:
    needs: version
    if: needs.version.outputs.app_ver != ''
    runs-on: windows-latest
    env:
      # Code signing (optional): base64 of a .pfx code signing certificate & its password as repository
      # secrets. Without them, executable & installer are built unsigned (SmartScreen warning).
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      # Or Azure Artifact Signing (no .pfx file, about 10 USD a month): repository variables AZURE_SIGNING_ENDPOINT,
      # AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE & secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET.
      # Used only without .pfx certificate.
      USE_AZURE_SIGNING: ${{ secrets.WINDOWS_CERT_PFX_BASE64 == '' && vars.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_CLIENT_SECRET != '' }}
    outputs:
      sha256: ${{ steps.get_hash.outputs.hash_output }}
    steps:
    - name: Checkout tested commit
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.version.outputs.sha }}

    - name: Set up Python 3.12 environment for Windows build
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        architecture: "x64"

    - name: Set version
      run: python tools/next_version.py --write ${{ needs.version.outputs.app_ver }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller openvr

    - name: Build Windows executable
      run: python build_pyinstaller.py -c

    - name: Sign executable
      if: env.HAS_SIGNING_CERT == 'true'
      shell: pwsh
      run: |
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
          Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1
        $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
        try {
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem ./dist/TinyPedal -Filter *.exe).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } finally {
          Remove-Item $pfx -ErrorAction SilentlyContinue
        }

    - name: Sign executable (Azure Artifact Signing)
      if: env.USE_AZURE_SIGNING == 'true'
      uses: azure/artifact-signing-action@v2
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: ${{ github.workspace }}/dist/TinyPedal
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: ZIP Windows file
      shell: pwsh
      run: |
        Compress-Archive -Path ./dist/TinyPedal -DestinationPath ./ModernTinyPedals-${{ needs.version.outputs.app_ver }}-windows.zip

    - name: Build Windows installer
      shell: pwsh
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
        & $iscc /DAppVersion=${{ needs.version.outputs.app_ver }} installer\tinypedal.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Move-Item ./dist/ModernTinyPedals-${{ needs.version.outputs.app_ver }}-windows-setup.exe .

    - name: Sign installer
      if: env.HAS_SIGNING_CERT == 'true'
      shell: pwsh
      run: |
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
          Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1
        $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
        try {
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 ./ModernTinyPedals-${{ needs.version.outputs.app_ver }}-windows-setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } finally {
          Remove-Item $pfx -ErrorAction SilentlyContinue
        }

    - name: Sign installer (Azure Artifact Signing)
      if: env.USE_AZURE_SIGNING == 'true'
      uses: azure/artifact-signing-action@v2
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files: ${{ github.workspace }}/ModernTinyPedals-${{ needs.version.outputs.app_ver }}-windows-setup.exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Check hash sum
      id: get_hash
      run: |
        setup_name=ModernTinyPedals-${{ needs.version.outputs.app_ver }}-windows-setup.exe
        sha256sum $setup_name | sed 's/\*//g' > $setup_name.sha256
        sha256hash=$(sha256sum ModernTinyPedals-${{ needs.version.outputs.app_ver }}-windows.zip | sed 's/\*//g')
        echo "hash_output=${sha256hash}" >> $GITHUB_OUTPUT
        cat $setup_name.sha256

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: |
          ModernTinyPedals-${{ needs.version.outputs.app_ver }}-windows.zip
          ModernTinyPedals-${{ needs.version.outputs.app_ver }}-windows-setup.exe
          ModernTinyPedals-${{ needs.version.outputs.app_ver }}-windows-setup.exe.sha256

  # Tag the tested commit and publish release with notes (the changelog)
  release:
    needs: [version, linux, windows]
    if: ${{ !inputs.test_build }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout tested commit with full history and tags
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.version.outputs.sha }}
        fetch-depth: 0

    - name: Download builds
      uses: actions/download-artifact@v4
      with:
        path: builds
        merge-multiple: true

    - name: Release notes from commits since previous release
      run: |
        python3 tools/gen_release_notes.py v${{ needs.version.outputs.app_ver }} > release.txt
        {
          echo ""
          echo "### SHA256"
          echo ""
          echo "- \`${{ needs.linux.outputs.sha256 }}\`"
          echo "- \`${{ needs.windows.outputs.sha256 }}\`"
        } >> release.txt
        cat release.txt

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.version.outputs.app_ver }}
        target_commitish: ${{ needs.version.outputs.sha }}
        name: Modern Tiny Pedals ${{ needs.version.outputs.app_ver }}
        body_path: release.txt
        files: builds/*
