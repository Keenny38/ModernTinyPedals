name: Build and Release

# A release is published on demand (python tools/release.py, or "Run workflow" on master), never by a push:
# pushes to master only run Checks, fixes can follow each other until everything is green.
# Refused unless Checks passed on the master commit and both changelogs have the version section.
# Version is computed from commits since the last release (tools/next_version.py):
# first release 0.10.0, then minor + 1 when a commit title starts with "Add", else patch + 1.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto: from commit titles)"
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      test_build:
        description: "Test build (no release)"
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

# Read only by default, only the release job can write (tag & release)
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Decide version, refuse when Checks did not pass, skip when nothing to release
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # look up Checks result of the commit
    outputs:
      app_ver: ${{ steps.next.outputs.app_ver }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
    - name: Checkout tested commit with full history and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Release only from master, after Checks passed
      if: ${{ !inputs.test_build }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$GITHUB_REF" != "refs/heads/master" ]; then
          echo "::error::Releases are published from master only (use test_build on other branches)"
          exit 1
        fi
        passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Checks --commit "$GITHUB_SHA" \
          --status success --limit 1 --json databaseId --jq length)
        if [ "$passed" != "1" ]; then
          echo "::error::Checks did not pass on $GITHUB_SHA"
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.13"

    - name: Next version
      id: next
      env:
        BUMP: ${{ inputs.bump || 'auto' }}
        TEST_BUILD: ${{ inputs.test_build }}
      run: |
        ver=$(python tools/next_version.py --bump "$BUMP")
        echo "app_ver=${ver}" >> $GITHUB_OUTPUT
        echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "Next version: ${ver:-none (no change since last release)}"
        # Release notes of both app languages come from the changelogs: no release without them
        # (a test build only warns)
        missing=0
        for changelog in CHANGELOG.md CHANGELOG.fr.md; do
          if [ -n "$ver" ] && ! python tools/gen_release_notes.py --check-changelog "$ver" --changelog "$changelog"; then
            echo "::error::$changelog has no '## $ver' section"
            missing=1
          fi
        done
        if [ "$missing" = "1" ] && [ "$TEST_BUILD" != "true" ]; then
          exit 1
        fi

  # Source code archive
  linux:
    needs: version
    if: needs.version.outputs.app_ver != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_VER: ${{ needs.version.outputs.app_ver }}
    outputs:
      sha256: ${{ steps.get_hash.outputs.hash_output }}
    steps:
    - name: Checkout tested commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ needs.version.outputs.sha }}
        persist-credentials: false

    - name: Set version
      run: python3 tools/next_version.py --write "$APP_VER"

    - name: ZIP source code
      run: |
        file_name=ModernTinyPedals-$APP_VER-source.zip
        zip -qr $file_name . -x "*.git/*" -x "*.github/*"

    - name: Check hash sum
      id: get_hash
      run: |
        sha256hash=$(sha256sum ModernTinyPedals-$APP_VER-source.zip)
        echo "hash_output=${sha256hash}" >> $GITHUB_OUTPUT
        echo $sha256hash

    - name: Upload build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: source
        path: ModernTinyPedals-${{ needs.version.outputs.app_ver }}-source.zip

  # Windows installer, published as is (with its .sha256 file) & zipped (setup.zip), beside the source ZIP
  windows:
    needs: version
    if: needs.version.outputs.app_ver != ''
    runs-on: windows-latest
    timeout-minutes: 60
    # Signing secrets & variables belong to the "release" environment, open to master only:
    # a test build (any branch) runs in "test-build", without them, and is never signed
    environment: ${{ inputs.test_build && 'test-build' || 'release' }}
    env:
      APP_VER: ${{ needs.version.outputs.app_ver }}
      # Code signing (optional): base64 of a .pfx code signing certificate & its password as secrets of the
      # "release" environment. Without them, executable & installer are built unsigned (SmartScreen warning).
      # Secrets themselves are only given to the signing steps.
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      # Or Azure Artifact Signing (no .pfx file, about 10 USD a month): "release" variables AZURE_SIGNING_ENDPOINT,
      # AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE & secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET.
      # Used only without .pfx certificate.
      USE_AZURE_SIGNING: ${{ secrets.WINDOWS_CERT_PFX_BASE64 == '' && vars.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_CLIENT_SECRET != '' }}
    outputs:
      sha256: ${{ steps.get_hash.outputs.hash_output }}
      installer_sha256: ${{ steps.get_hash.outputs.installer_hash }}
    steps:
    - name: Checkout tested commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ needs.version.outputs.sha }}
        persist-credentials: false

    # Same Python as one of the Checks matrix versions, pinned dependencies (requirements-build.txt)
    - name: Set up Python 3.13 environment for Windows build
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.13"
        architecture: "x64"

    - name: Set version
      run: python tools/next_version.py --write "$APP_VER"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt

    # VR overlay in OpenXR games: native layer DLL (headers fetched at pinned commits, see CMakeLists.txt),
    # tested with a fake OpenXR runtime, then bundled in lib/openxr_layer_bundle by build_pyinstaller.py
    - name: Build OpenXR layer
      run: |
        cmake -S native/openxr_layer -B native/openxr_layer/build -A x64 -DTPVR_BUILD_TESTS=ON
        cmake --build native/openxr_layer/build --config Release
        ctest --test-dir native/openxr_layer/build -C Release --output-on-failure

    - name: Build Windows executable
      run: python build_pyinstaller.py -c --require-openxr-layer

    # Start the built executable: modules, data files, QML modules & worker process (0.19.0 shipped without
    # multiprocessing, the lap viewer jobs failed). Nothing is published if it fails.
    - name: Self test of built executable
      shell: pwsh
      run: |
        $report = Join-Path $env:RUNNER_TEMP "self-test.txt"
        $process = Start-Process -FilePath ./dist/TinyPedal/tinypedal.exe -ArgumentList "--self-test", "`"$report`"" `
          -WorkingDirectory ./dist/TinyPedal -Wait -PassThru
        if (Test-Path $report) { Get-Content $report }
        if ($process.ExitCode -ne 0) { Write-Error "Self test failed (exit code $($process.ExitCode))"; exit 1 }

    - name: Sign executable
      if: env.HAS_SIGNING_CERT == 'true'
      shell: pwsh
      env:
        WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      run: |
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
          Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1
        $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
        try {
          # OpenXR layer too: loaded by games (some anti-cheat or antivirus tools distrust unsigned DLLs)
          $files = @((Get-ChildItem ./dist/TinyPedal -Filter *.exe).FullName) + (Resolve-Path ./dist/TinyPedal/lib/openxr_layer_bundle/TinyPedalXrLayer.dll).Path
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } finally {
          Remove-Item $pfx -ErrorAction SilentlyContinue
        }

    - name: Sign executable (Azure Artifact Signing)
      if: env.USE_AZURE_SIGNING == 'true'
      uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: ${{ github.workspace }}/dist/TinyPedal
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Sign OpenXR layer (Azure Artifact Signing)
      if: env.USE_AZURE_SIGNING == 'true'
      uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files: ${{ github.workspace }}/dist/TinyPedal/lib/openxr_layer_bundle/TinyPedalXrLayer.dll
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Build Windows installer
      shell: pwsh
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
        & $iscc "/DAppVersion=$env:APP_VER" installer\tinypedal.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Move-Item "./dist/ModernTinyPedals-$env:APP_VER-windows-setup.exe" .

    - name: Sign installer
      if: env.HAS_SIGNING_CERT == 'true'
      shell: pwsh
      env:
        WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      run: |
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
          Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1
        $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
        try {
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "./ModernTinyPedals-$env:APP_VER-windows-setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } finally {
          Remove-Item $pfx -ErrorAction SilentlyContinue
        }

    - name: Sign installer (Azure Artifact Signing)
      if: env.USE_AZURE_SIGNING == 'true'
      uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files: ${{ github.workspace }}/ModernTinyPedals-${{ needs.version.outputs.app_ver }}-windows-setup.exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    # The app updater (0.20 and later) downloads this ZIP and runs the installer inside (only file of the archive)
    - name: ZIP Windows installer
      shell: pwsh
      run: |
        Compress-Archive -Path "./ModernTinyPedals-$env:APP_VER-windows-setup.exe" `
          -DestinationPath "./ModernTinyPedals-$env:APP_VER-setup.zip"

    # sha256sum format "<hash>  <file>" (two spaces), listed in release notes, checked by "sha256sum -c"
    # & by the app updater (with the asset digest given by GitHub). The installer also gets its .sha256 file:
    # apps up to 0.19 update only from a release with "<name>-windows-setup.exe" & "<name>-windows-setup.exe.sha256"
    - name: Check hash sum
      id: get_hash
      run: |
        sha256hash=$(sha256sum ModernTinyPedals-$APP_VER-setup.zip | sed 's/ \*/  /')
        installer=ModernTinyPedals-$APP_VER-windows-setup.exe
        installer_hash=$(sha256sum $installer | sed 's/ \*/  /')
        printf '%s\n' "$installer_hash" > $installer.sha256
        echo "hash_output=${sha256hash}" >> $GITHUB_OUTPUT
        echo "installer_hash=${installer_hash}" >> $GITHUB_OUTPUT
        echo $sha256hash
        echo $installer_hash

    - name: Upload build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: windows
        path: |
          ModernTinyPedals-${{ needs.version.outputs.app_ver }}-setup.zip
          ModernTinyPedals-${{ needs.version.outputs.app_ver }}-windows-setup.exe
          ModernTinyPedals-${{ needs.version.outputs.app_ver }}-windows-setup.exe.sha256

  # Tag the tested commit and publish release with notes (the changelog)
  release:
    needs: [version, linux, windows]
    if: ${{ !inputs.test_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # create the tag & the release
      id-token: write  # sign the build provenance (Sigstore)
      attestations: write  # store the build provenance
    env:
      APP_VER: ${{ needs.version.outputs.app_ver }}
    steps:
    - name: Checkout tested commit with full history and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ needs.version.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Download builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        path: builds
        merge-multiple: true

    # Published installer, the one inside setup.zip & its .sha256 file must all match
    - name: Check installer files
      run: |
        mkdir extracted
        unzip -j "builds/ModernTinyPedals-$APP_VER-setup.zip" -d extracted
        cmp "extracted/ModernTinyPedals-$APP_VER-windows-setup.exe" "builds/ModernTinyPedals-$APP_VER-windows-setup.exe"
        (cd builds && sha256sum -c "ModernTinyPedals-$APP_VER-windows-setup.exe.sha256")
        ls -l builds

    # Signed proof that the files were built by this workflow from this commit, checked with
    # "gh attestation verify <file> --repo Keenny38/ModernTinyPedals"
    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      with:
        subject-path: |
          builds/*.zip
          builds/*.exe

    - name: Release notes from commits since previous release
      env:
        SOURCE_SHA256: ${{ needs.linux.outputs.sha256 }}
        SETUP_SHA256: ${{ needs.windows.outputs.sha256 }}
        INSTALLER_SHA256: ${{ needs.windows.outputs.installer_sha256 }}
      run: |
        python3 tools/gen_release_notes.py "v$APP_VER" > release.txt
        {
          echo ""
          echo "### SHA256"
          echo ""
          echo "- \`$INSTALLER_SHA256\`"
          echo "- \`$SETUP_SHA256\`"
          echo "- \`$SOURCE_SHA256\`"
        } >> release.txt
        cat release.txt

    # GitHub CLI of the runner (no third-party action with write access): the release is created as a draft,
    # gets its files, then is published (required by immutable releases)
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ needs.version.outputs.sha }}
      run: |
        gh release create "v$APP_VER" builds/* --repo "$GITHUB_REPOSITORY" --target "$SHA" \
          --title "Modern Tiny Pedals $APP_VER" --notes-file release.txt
