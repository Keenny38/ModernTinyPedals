name: Changelog

# Regenerate CHANGELOG.md from commit history after every push to master
on:
  push:
    branches: [master]
    paths-ignore:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout master with full history and tags
      uses: actions/checkout@v6
      with:
        ref: master
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Generate changelog
      run: python tools/gen_changelog.py

    - name: Commit changelog if changed
      run: |
        if git diff --quiet -- CHANGELOG.md; then
          echo "Changelog already up to date"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add CHANGELOG.md
        git commit -m "Update changelog [skip ci]"
        git push origin HEAD:master
